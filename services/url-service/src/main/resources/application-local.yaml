spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:url_db}
    username: ${DB_USERNAME:linkpulse}
    password: ${DB_PASSWORD:linkpulse}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.linkpulse: DEBUG